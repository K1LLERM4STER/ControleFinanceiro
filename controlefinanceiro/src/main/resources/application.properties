spring.config.import=optional:file:.env[.properties],optional:file:controlefinanceiro/.env[.properties]

server.port=${APP_PORT:8081}

spring.application.name=controlefinanceiro
spring.datasource.url=jdbc:postgresql://localhost:5432/finance_api
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
